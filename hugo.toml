baseURL = "https://demietrich.com/"
locale = "en-us"
title = "Demietrich"
theme = "demitheme"

# Raw benchmark result data kept next to the article; not site content.
# (The runner's cache dir contains .html reports that fail Hugo's content security policy.)
ignoreFiles = [
  "[_-]benchmarks",
  "nanbeige_rerun",
  "Qwen3.8-9B-Distill-arena_hard_rerurn",
]

[params]
  description = "Engineer. Tinkerer. Local LLM Enthusiast."
  author = "Demietrich"
    github = "https://github.com/dboybaker"
    linkedin = "https://www.linkedin.com/in/demietrich/"
    huggingface = "https://huggingface.co/dboybaker"
    openpowerlifting = "https://www.openpowerlifting.org/u/demietrichbaker"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 3

[[menu.main]]
  name = "Benchmarks"
  url = "/benchmarks/"
  weight = 4

[markup.goldmark.renderer]
  unsafe = true
