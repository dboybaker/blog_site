<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8E8"/>
      <stop offset="100%" stop-color="#D9EEF6"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="700" height="270" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.75">
    <ellipse cx="115" cy="65" rx="52" ry="18"/>
    <ellipse cx="145" cy="60" rx="42" ry="14"/>
    <ellipse cx="575" cy="95" rx="62" ry="20"/>
    <ellipse cx="605" cy="90" rx="46" ry="15"/>
  </g>

  <!-- Road -->
  <rect x="0" y="270" width="700" height="150" fill="#3B3B3B"/>
  <rect x="0" y="270" width="700" height="8" fill="#555555"/>

  <!-- Road markings -->
  <g stroke="#666666" stroke-width="3" stroke-dasharray="22 22" fill="none" stroke-linecap="round">
    <line x1="0" y1="332" x2="700" y2="332"/>
    <line x1="0" y1="378" x2="700" y2="378"/>
  </g>

  <!-- ===== Bicycle Frame ===== -->
  <g stroke="#2B2B2B" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Main frame: back wheel → seat tube → front wheel → back wheel -->
    <polyline points="230,350 310,168 480,350"/>
    <!-- Top tube -->
    <line x1="310" y1="168" x2="400" y2="280"/>
  </g>

  <!-- ===== Back Wheel ===== -->
  <g>
    <circle cx="230" cy="350" r="52" fill="none" stroke="#2B2B2B" stroke-width="4"/>
    <circle cx="230" cy="350" r="44" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
    <circle cx="230" cy="350" r="6" fill="#1a1a1a"/>
    <!-- Pedal arm -->
    <line x1="230" y1="350" x2="178" y2="350" stroke="#2B2B2B" stroke-width="3"/>
    <line x1="178" y1="350" x2="189" y2="330" stroke="#666666" stroke-width="2"/>
    <line x1="178" y1="350" x2="189" y2="370" stroke="#666666" stroke-width="2"/>
    <circle cx="189" cy="350" r="3" fill="#333333"/>
  </g>

  <!-- ===== Front Wheel ===== -->
  <g>
    <circle cx="480" cy="350" r="48" fill="none" stroke="#2B2B2B" stroke-width="4"/>
    <circle cx="480" cy="350" r="41" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
    <circle cx="480" cy="350" r="6" fill="#1a1a1a"/>
  </g>

  <!-- ===== Handlebars ===== -->
  <g stroke="#2B2B2B" stroke-width="4" stroke-linecap="round">
    <line x1="310" y1="168" x2="342" y2="195"/>
    <line x1="352" y1="212" x2="382" y2="212"/>
  </g>
  <circle cx="342" cy="195" r="3" fill="#2B2B2B"/>
  <circle cx="382" cy="212" r="3" fill="#2B2B2B"/>

  <!-- ===== Seat ===== -->
  <ellipse cx="305" cy="162" rx="32" ry="8" fill="#556B2F"/>

  <!-- ===== Pelican ===== -->
  <g>
    <!-- Legs -->
    <g stroke="#6B4226" stroke-width="3" stroke-linecap="round">
      <line x1="343" y1="162" x2="341" y2="180"/>
      <line x1="361" y1="162" x2="361" y2="182"/>
    </g>
    <!-- Feet -->
    <ellipse cx="340" cy="182" rx="8" ry="4" fill="#6B4226"/>
    <ellipse cx="361" cy="184" rx="8" ry="4" fill="#6B4226"/>

    <!-- Body -->
    <ellipse cx="322" cy="154" rx="72" ry="52" fill="#6B4226"/>

    <!-- Tail -->
    <ellipse cx="358" cy="147" rx="14" ry="24" fill="#6B4226"/>

    <!-- Head (pelican-style white head) -->
    <circle cx="385" cy="140" r="20" fill="#F5F5F5"/>
    <!-- Eye -->
    <circle cx="391" cy="140" r="2.5" fill="#222222"/>
    <circle cx="392.5" cy="139" r="0.8" fill="#FFFFFF"/>

    <!-- Beak (pale orange-brown, pelican-style) -->
    <path d="M396,141 Q414,140 432,141 L432,151 Q414,150 396,149 Z" fill="#E8B878"/>
    <line x1="414" y1="140" x2="414" y2="150" stroke="#C99A5C" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
