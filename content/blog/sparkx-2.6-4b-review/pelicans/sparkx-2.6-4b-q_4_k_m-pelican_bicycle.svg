<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a02e"/>
      <stop offset="55%" stop-color="#e2850c"/>
      <stop offset="100%" stop-color="#c06a08"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7dcc4"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f6f8e"/>
      <stop offset="100%" stop-color="#143049"/>
    </linearGradient>
    <radialGradient id="wheelGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6f6f6f"/>
      <stop offset="70%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </radialGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fb0e8"/>
      <stop offset="100%" stop-color="#c8e4f6"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecb8a"/>
      <stop offset="100%" stop-color="#5fae66"/>
    </linearGradient>
    <linearGradient id="seatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5340"/>
      <stop offset="100%" stop-color="#4a3626"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- clouds -->
  <g opacity="0.55">
    <ellipse cx="130" cy="90" rx="60" ry="13" fill="#eef6fb"/>
    <ellipse cx="690" cy="110" rx="75" ry="16" fill="#eef6fb"/>
    <ellipse cx="700" cy="70" rx="42" ry="11" fill="#eef6fb"/>
  </g>

  <!-- ground -->
  <rect y="400" width="800" height="100" fill="url(#groundGrad)"/>
  <!-- grass -->
  <g stroke="#4f9a4f" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="432" x2="66" y2="414"/>
    <line x1="110" y1="438" x2="126" y2="418"/>
    <line x1="160" y1="428" x2="174" y2="410"/>
    <line x1="230" y1="436" x2="246" y2="416"/>
    <line x1="290" y1="430" x2="304" y2="412"/>
    <line x1="360" y1="438" x2="376" y2="420"/>
    <line x1="440" y1="432" x2="456" y2="414"/>
    <line x1="520" y1="440" x2="534" y2="422"/>
    <line x1="620" y1="435" x2="638" y2="417"/>
    <line x1="700" y1="430" x2="716" y2="412"/>
  </g>

  <!-- ===== Bicycle ===== -->

  <!-- Front wheel -->
  <g>
    <circle cx="290" cy="420" r="65" fill="url(#wheelGrad)"/>
    <g stroke="#3a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="290" y1="420" x2="255" y2="425"/>
      <line x1="290" y1="420" x2="325" y2="425"/>
      <line x1="290" y1="420" x2="244" y2="468"/>
      <line x1="290" y1="420" x2="336" y2="468"/>
      <line x1="290" y1="420" x2="290" y2="355"/>
      <line x1="290" y1="420" x2="355" y2="420"/>
    </g>
    <circle cx="290" cy="420" r="9" fill="#1a1a1a"/>
  </g>

  <!-- Rear wheel -->
  <g>
    <circle cx="510" cy="420" r="65" fill="url(#wheelGrad)"/>
    <g stroke="#3a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="510" y1="420" x2="475" y2="425"/>
      <line x1="510" y1="420" x2="545" y2="425"/>
      <line x1="510" y1="420" x2="464" y2="468"/>
      <line x1="510" y1="420" x2="556" y2="468"/>
      <line x1="510" y1="420" x2="510" y2="355"/>
      <line x1="510" y1="420" x2="445" y2="420"/>
    </g>
    <circle cx="510" cy="420" r="9" fill="#1a1a1a"/>
  </g>

  <!-- Frame -->
  <g stroke="#4a3a28" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- seat tube -->
    <path d="M 295 410 L 430 200"/>
    <!-- top tube -->
    <path d="M 430 200 L 365 135"/>
    <!-- head tube -->
    <path d="M 365 135 L 300 420"/>
    <!-- frame rail -->
    <path d="M 300 420 L 470 420"/>
  </g>

  <!-- Seat -->
  <path d="M 395 218 L 465 218 L 460 238 L 400 238 Z" fill="url(#seatGrad)"/>

  <!-- Chainring -->
  <circle cx="300" cy="245" r="13" fill="#262626"/>

  <!-- Handlebars -->
  <g stroke="#c9b6a0" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M 300 245 L 290 205"/>
    <path d="M 300 245 L 310 205"/>
  </g>
  <!-- Grips -->
  <rect x="286" y="199" width="14" height="12" rx="4" fill="#3a2f24"/>
  <rect x="310" y="199" width="14" height="12" rx="4" fill="#3a2f24"/>

  <!-- Chain -->
  <g fill="#262626">
    <ellipse cx="390" cy="322" rx="12" ry="6"/>
  </g>

  <!-- Crank + pedals -->
  <g stroke="#262626" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="295" y1="410" x2="265" y2="426"/>
    <line x1="295" y1="410" x2="325" y2="426"/>
  </g>
  <g fill="#222" stroke="#444" stroke-width="1.5">
    <ellipse cx="265" cy="426" rx="12" ry="6"/>
    <ellipse cx="325" cy="426" rx="12" ry="6"/>
  </g>

  <!-- ===== Pelican ===== -->

  <!-- Body -->
  <ellipse cx="425" cy="145" rx="52" ry="40" fill="url(#bodyGrad)"/>
  <!-- highlight -->
  <ellipse cx="446" cy="128" rx="12" ry="6" fill="#ffffff" opacity="0.18"/>
  <!-- Belly -->
  <ellipse cx="425" cy="172" rx="40" ry="30" fill="url(#bellyGrad)"/>
  <!-- Tail feather -->
  <path d="M 382 146 C 355 144, 342 162, 358 174 C 372 166, 380 156, 386 150 Z" fill="url(#bodyGrad)"/>

  <!-- Neck -->
  <path d="M 425 152 C 422 120, 425 100, 456 118 C 462 122, 468 133, 474 140" fill="url(#bodyGrad)"/>

  <!-- Head -->
  <circle cx="458" cy="118" r="16" fill="url(#bodyGrad)"/>

  <!-- Eye + eye patch -->
  <circle cx="447" cy="118" r="5.5" fill="#ffffff"/>
  <circle cx="450" cy="119" r="2.6" fill="#1a1a1a"/>
  <path d="M 443 114 C 447 108, 453 108, 457 114 C 455 120, 449 122, 445 119 Z" fill="#ffffff"/>

  <!-- Beak -->
  <path d="M 472 120 C 486 124, 496 138, 514 146 C 530 150, 550 141, 572 129"
        fill="none" stroke="url(#billGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 572 129 L 586 123 L 583 133 Z" fill="#143049"/>
  <line x1="572" y1="129" x2="586" y2="123" stroke="#143049" stroke-width="3" stroke-linecap="round"/>

  <!-- Legs -->
  <path d="M 430 178 C 412 200, 388 235, 296 250" fill="none" stroke="#f4efe7" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 440 178 C 426 200, 402 235, 316 250" fill="none" stroke="#f4efe7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Feet -->
  <ellipse cx="296" cy="250" rx="13" ry="6" fill="url(#bodyGrad)"/>
  <ellipse cx="316" cy="250" rx="13" ry="6" fill="url(#bodyGrad)"/>
</svg>
