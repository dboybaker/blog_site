<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#e8f4e8"/>
  
  <!-- Bicycle Frame -->
  <path d="M120 220 L160 220 L180 160 L280 160 L300 220 L300 240 L280 260 L180 260 L160 220 Z" 
        fill="none" stroke="#5d4037" stroke-width="4" stroke-linejoin="round"/>
  <path d="M160 220 L180 160 L280 160" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Front Wheel -->
  <circle cx="120" cy="220" r="25" fill="none" stroke="#5d4037" stroke-width="4"/>
  <circle cx="120" cy="220" r="25" fill="none" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="120" cy="220" r="8" fill="#5d4037"/>
  
  <!-- Rear Wheel -->
  <circle cx="300" cy="240" r="25" fill="none" stroke="#5d4037" stroke-width="4"/>
  <circle cx="300" cy="240" r="25" fill="none" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="300" cy="240" r="8" fill="#5d4037"/>
  
  <!-- Handlebars -->
  <path d="M280 160 L280 140 L260 130" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
  <circle cx="280" cy="140" r="5" fill="#5d4037"/>
  
  <!-- Pelican Body -->
  <ellipse cx="200" cy="180" rx="35" ry="45" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  
  <!-- Pelican Neck -->
  <path d="M200 135 Q200 110 200 90" fill="none" stroke="#ffcc80" stroke-width="18" stroke-linecap="round"/>
  <path d="M200 135 Q200 110 200 90" fill="none" stroke="#e65100" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pelican Head -->
  <circle cx="200" cy="75" r="28" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  
  <!-- Pelican Beak -->
  <path d="M222 75 L280 75 L265 120 Z" fill="#ffab91" stroke="#e65100" stroke-width="2"/>
  <ellipse cx="260" cy="110" rx="8" ry="3" fill="#ff5722" opacity="0.6"/>
  
  <!-- Pelican Eye -->
  <circle cx="192" cy="68" r="4" fill="#3e2723"/>
  <circle cx="193" cy="67" r="1.5" fill="white"/>
  
  <!-- Pelican Wing -->
  <path d="M200 150 Q230 160 240 170 Q245 185 230 195 Q200 190 195 170 Z" 
        fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  
  <!-- Pelican Wing (back) -->
  <path d="M165 165 Q150 175 155 190 Q170 195 185 185 Q180 170 170 160 Z" 
        fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  
  <!-- Legs -->
  <path d="M195 180 L190 210 L205 210 L200 180 Z" fill="#e65100"/>
  <path d="M205 180 L210 210 L225 210 L220 180 Z" fill="#e65100"/>
  
  <!-- Pedal Crank -->
  <circle cx="200" cy="220" r="6" fill="#5d4037"/>
  <line x1="200" y1="220" x2="170" y2="220" stroke="#5d4037" stroke-width="3"/>
  <line x1="200" y1="220" x2="200" y2="190" stroke="#5d4037" stroke-width="3"/>
  <line x1="200" y1="220" x2="230" y2="220" stroke="#5d4037" stroke-width="3"/>
</svg>