<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cde8a8"/>
      <stop offset="100%" stop-color="#e8f0d8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="100%" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="pelicanBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="bikeFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="frameBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="650" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="760" cy="110" r="70" fill="url(#sun)" opacity="0.9"/>
  <circle cx="760" cy="110" r="40" fill="#fff" opacity="0.4"/>

  <!-- Distant sky / mountains -->
  <path d="M0 360 Q150 300 300 340 Q450 280 600 330 Q750 290 900 360 L900 410 L0 410 Z" fill="#9bb87a" opacity="0.45"/>

  <!-- Bicycle -->
  <g transform="translate(250 300)">
    <!-- Wheel (rear) -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#1a1a1a" stroke-width="7"/>
    <circle cx="0" cy="0" r="36" fill="#2a2a2a"/>
    <circle cx="0" cy="0" r="7" fill="#6a6a6a"/>
    <circle cx="0" cy="0" r="16" fill="#3a3a3a"/>
    <circle cx="0" cy="0" r="30" fill="#111111"/>

    <!-- Frame -->
    <rect x="-60" y="-8" width="120" height="116" rx="9" fill="url(#bikeFrame)" stroke="#0d0d0d" stroke-width="3"/>
    <line x1="-60" y1="-8" x2="-60" y2="108" stroke="#0d0d0d" stroke-width="3"/>
    <line x1="50" y1="-8" x2="50" y2="108" stroke="#0d0d0d" stroke-width="3"/>
    <line x1="-60" y1="108" x2="60" y2="108" stroke="#0d0d0d" stroke-width="3"/>
    <line x1="0" y1="-8" x2="0" y2="108" stroke="#0d0d0d" stroke-width="3"/>

    <!-- Chain -->
    <path d="M-90 40 Q0 70 90 40" fill="none" stroke="#b0b0b0" stroke-width="2" opacity="0.85"/>
    <path d="M-90 40 Q0 70 90 40" fill="none" stroke="#888" stroke-width="1" opacity="0.5"/>
    <path d="M-88 38 Q0 68 88 38" fill="none" stroke="#a0a0a0" stroke-width="1" opacity="0.4"/>

    <!-- Rear wheel -->
    <circle cx="0" cy="108" r="50" fill="none" stroke="#1a1a1a" stroke-width="5"/>
    <circle cx="0" cy="108" r="50" fill="none" stroke="#1a1a1a" stroke-width="5" opacity="0.4"/>

    <!-- Pedals -->
    <circle cx="-36" cy="108" r="7" fill="#6a6a6a"/>
    <circle cx="-36" cy="108" r="14" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="36" cy="108" r="7" fill="#6a6a6a"/>
    <circle cx="36" cy="108" r="14" fill="none" stroke="#333" stroke-width="2"/>

    <!-- Saddle -->
    <ellipse cx="0" cy="-28" rx="26" ry="14" fill="#2a2a2a"/>
    <rect x="-20" y="-36" width="40" height="6" fill="#3a3a3a"/>

    <!-- Handlebar -->
    <rect x="-18" y="-44" width="36" height="10" fill="#444"/>
    <rect x="-22" y="-42" width="8" height="4" fill="#333"/>
    <rect x="24" y="-42" width="8" height="4" fill="#333"/>

    <!-- Bottom tire ring -->
    <circle cx="0" cy="108" r="50" fill="none" stroke="#0d0d0d" stroke-width="5"/>
  </g>

  <!-- Pelican riding the bicycle -->
  <g transform="translate(430 280)">
    <!-- Legs -->
    <g>
      <path d="M-38 0 L-26 -28 L-30 0 Z" fill="url(#pelicanBody)" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M38 0 L26 -28 L30 0 Z" fill="url(#pelicanBody)" stroke="#1a1a1a" stroke-width="2"/>
    </g>

    <!-- Wing (upper, dominant) -->
    <path d="M-10 -12 L-30 -125 Q-40 -148 -20 -152 Q5 -140 15 -122 L30 -12" fill="#b8783a" opacity="0.85" stroke="#7a4a1a" stroke-width="2"/>
    <path d="M-10 -12 L-30 -125 Q-40 -148 -20 -152 Q5 -140 15 -122 L30 -12" fill="none" stroke="#7a4a1a" stroke-width="2" stroke-dasharray="3 4" opacity="0.6"/>

    <!-- Tail -->
    <path d="M-70 -62 Q-80 -85 -60 -105" fill="none" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M0 -22 Q-40 -60 -80 -22" fill="none" stroke="#3a3a3a" stroke-width="9" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="0" cy="-62" rx="62" ry="46" fill="url(#pelicanBody)" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Head -->
    <ellipse cx="46" cy="-108" rx="44" ry="36" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="54" cy="-110" r="5" fill="#fff" opacity="0.85"/>
    <circle cx="55" cy="-112" r="2.5" fill="#000"/>

    <!-- Beak -->
    <path d="M100 -86 Q118 -55 126 -32" fill="none" stroke="#8a5a2a" stroke-width="9" stroke-linecap="round"/>
    <path d="M100 -86 Q118 -55 126 -32" fill="none" stroke="#6a4a2a" stroke-width="4" opacity="0.6"/>

    <!-- Wing (flapping, lower) -->
    <path d="M0 -12 Q-25 -100 -20 -118 Q5 -105 15 -100 Q25 -96 20 -12 Q-20 -100 -25 -118" fill="#b8783a" opacity="0.7" stroke="#7a4a1a" stroke-width="2"/>
    <path d="M0 -12 Q-25 -100 -20 -118 Q5 -105 15 -100 Q25 -96 20 -12 Q-20 -100 -25 -118" fill="none" stroke="#7a4a1a" stroke-width="2" stroke-dasharray="3 4" opacity="0.6"/>
    <path d="M0 -12 Q-25 -100 -20 -118 Q5 -105 15 -100 Q25 -96 20 -12 Q-20 -100 -25 -118" fill="#d8904a" opacity="0.4" stroke="none"/>

    <!-- Shadow -->
    <ellipse cx="0" cy="-68" rx="50" ry="12" fill="#000" opacity="0.12"/>
  </g>

  <!-- Footprints -->
  <ellipse cx="250" cy="540" rx="45" ry="16" fill="#d4c09a" opacity="0.65"/>
  <ellipse cx="660" cy="540" rx="45" ry="16" fill="#d4c09a" opacity="0.65"/>

  <!-- Ground -->
  <ellipse cx="450" cy="560" rx="420" ry="28" fill="#c9b88a" opacity="0.4"/>
</svg>
