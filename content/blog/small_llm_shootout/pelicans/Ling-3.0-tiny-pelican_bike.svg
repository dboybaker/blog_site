  <circle cx="350" cy="320" r="30" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="350" cy="320" r="8" fill="#333"/>
  <line x1="350" y1="290" x2="350" y2="350" stroke="#888" stroke-width="1"/>
  <line x1="320" y1="320" x2="380" y2="320" stroke="#888" stroke-width="1"/>
