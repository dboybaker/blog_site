  <rect x="0" y="400" width="800" height="20" fill="#4a7a2e"/>
  
  <!-- Bicycle -->
  <!-- Main frame -->
  <line x1="350" y1="280" x2="550" y2="320" stroke="#333" stroke-width="4"/>
  <line x1="350" y1="280" x2="350" y2="320" stroke="#333" stroke-width="4"/>
  <line x1="350" y1="280" x2="300" y2="260" stroke="#333" stroke-width="4"/>
