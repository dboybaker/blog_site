<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BB8E0"/>
      <stop offset="100%" stop-color="#D4EFF7"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BA3B8"/>
      <stop offset="100%" stop-color="#35708A"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Distant clouds -->
  <ellipse cx="140" cy="70" rx="65" ry="26" fill="white" opacity="0.55"/>
  <ellipse cx="210" cy="55" rx="50" ry="22" fill="white" opacity="0.5"/>
  <ellipse cx="660" cy="95" rx="75" ry="28" fill="white" opacity="0.45"/>

  <!-- Ground -->
  <rect x="0" y="375" width="800" height="125" fill="#9DCF85"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#82BE6C" stroke-width="2.5"/>
  <line x1="0" y1="415" x2="800" y2="415" stroke="#74B05D" stroke-width="1.5" opacity="0.5"/>

  <!-- ============ BICYCLE ============ -->

  <!-- Back wheel -->
  <circle cx="395" cy="355" r="40" fill="#1A1A1A"/>
  <circle cx="395" cy="355" r="34" fill="none" stroke="#7A7A7A" stroke-width="3"/>
  <circle cx="395" cy="355" r="10" fill="none" stroke="#5A5A5A" stroke-width="2"/>

  <!-- Front wheel -->
  <circle cx="570" cy="355" r="40" fill="#1A1A1A"/>
  <circle cx="570" cy="355" r="34" fill="none" stroke="#7A7A7A" stroke-width="3"/>
  <circle cx="570" cy="355" r="10" fill="none" stroke="#5A5A5A" stroke-width="2"/>

  <!-- Frame -->
  <path d="M395,355 L395,290" stroke="url(#frame)" stroke-width="8" stroke-linecap="round"/>
  <path d="M395,355 L570,355" stroke="url(#frame)" stroke-width="8" stroke-linecap="round"/>
  <path d="M570,355 L570,290" stroke="url(#frame)" stroke-width="8" stroke-linecap="round"/>
  <path d="M395,290 Q395,225 570,225" stroke="url(#frame)" stroke-width="7" stroke-linecap="round"/>
  <path d="M395,290 Q345,255 395,225" stroke="url(#frame)" stroke-width="6" stroke-linecap="round"/>
  <path d="M570,290 Q570,255 570,225" stroke="url(#frame)" stroke-width="6" stroke-linecap="round"/>

  <!-- Handlebars -->
  <path d="M515,240 Q515,200 548,200" stroke="url(#frame)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M485,240 Q485,200 452,200" stroke="url(#frame)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Seat -->
  <ellipse cx="395" cy="262" rx="13" ry="5" fill="#4A90A4"/>

  <!-- Pedals -->
  <circle cx="395" cy="372" r="9" fill="#333"/>
  <circle cx="570" cy="372" r="9" fill="#333"/>

  <!-- ============ PELICAN ============ -->

  <!-- Pelican legs (connecting body to bike) -->
  <path d="M380,308 L355,330 L355,350" stroke="#2E5A44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M475,355 L525,378 L525,395" stroke="#2E5A44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pelican body (main body, sitting on bike) -->
  <ellipse cx="475" cy="348" rx="50" ry="34" fill="#2E5A44"/>

  <!-- Pelican neck -->
  <path d="M425,342 Q402,324 365,310" stroke="#2E5A44" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Pelican beak (large, forward-pointing) -->
  <path d="M365,308 Q275,292 210,300" stroke="#4A7C58" stroke-width="9.5" stroke-linecap="round" fill="none"/>
  <path d="M365,308 Q330,297 300,302" stroke="#5A8F68" stroke-width="6.5" stroke-linecap="round" fill="none"/>

  <!-- Pelican eyes -->
  <circle cx="378" cy="305" r="4.2" fill="white"/>
  <circle cx="378" cy="305" r="2.3" fill="#111"/>

  <!-- Pelican body (lower part) -->
  <ellipse cx="475" cy="358" rx="44" ry="28" fill="#2E5A44"/>
  <ellipse cx="475" cy="362" rx="30" ry="20" fill="#3A6E52"/>

  <!-- Pelican body back projection -->
  <path d="M420,345 Q395,330 372,322" stroke="#2E5A44" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M420,345 Q405,336 395,332" stroke="#3A6E52" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Pelican eye on body -->
  <circle cx="458" cy="345" r="4.2" fill="white"/>
  <circle cx="458" cy="345" r="2.3" fill="#111"/>

  <!-- Pelican feet on bike -->
  <ellipse cx="355" cy="350" rx="11" ry="6" fill="#2E5A44"/>
  <ellipse cx="525" cy="395" rx="11" ry="6" fill="#2E5A44"/>

  <!-- Pelican lower legs -->
  <path d="M355,350 L368,365 L368,382" stroke="#2E5A44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M525,395 L515,387 L515,372" stroke="#2E5A44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
