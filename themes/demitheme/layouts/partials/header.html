<header class="header">
  <div class="container">
    <div class="header-left">
      <a href="/" class="logo">
        <span class="logo-bracket"><</span>de<span class="logo-bracket">/></span>
      </a>
    </div>
    <nav class="nav">
      {{ range site.Menus.main }}
        {{ $isActive := eq $.Page.RelPermalink .URL }}
        {{ if and (eq .Name "Home") (eq $.Page.RelPermalink "/") }}{{ $isActive = true }}{{ end }}
        <a href="{{ .URL }}" class="nav-link{{ if $isActive }} active{{ end }}">
          {{ .Name }}
        </a>
      {{ end }}
      <form class="search-form search-form-mobile" action="/search/" method="GET">
        <input type="text" name="q" class="search-input" placeholder="Search posts..." autocomplete="off">
        <button type="submit" class="search-btn" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </form>
    </nav>
    <div class="header-right">
      <form class="search-form search-form-desktop" action="/search/" method="GET">
        <input type="text" name="q" class="search-input" placeholder="Search posts..." autocomplete="off">
        <button type="submit" class="search-btn" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </form>
    </div>
    <button class="mobile-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
